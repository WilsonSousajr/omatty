version: "2"
linters:
  enable:
    - funlen
    - dupl
    - gocyclo
    - gocognit
    - revive
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - forbidigo
    # Invariant 4 was prose for nine milestones and had gone stale without
    # anyone noticing: AGENTS.md said internal/ui was the only package
    # importing bubbletea, and internal/termwrap had been importing it for
    # milestones. Same move as gocognit below - a rule nothing enforced.
    - depguard
  settings:
    funlen:
      lines: 20
      statements: 15
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 10
    gocognit:
      # Cognitive complexity, not McCabe's: it weights nesting and ignores
      # switch arms, so it measures what a reader pays rather than what a
      # test suite must cover. 15 is SonarSource's own threshold. It is here
      # because AGENTS.md's "maximum 2 levels of indentation" had nothing
      # enforcing it, and nesting depth is exactly what this metric weights.
      min-complexity: 15
    depguard:
      rules:
        # Invariant 4. bubbleterm is pre-1.0 and will break; the blast radius
        # stays inside the one package we own. creack/pty rides with it because
        # termwrap is what owns the PTY.
        bubbleterm:
          files:
            - "!**/internal/tui/terminal/**"
          deny:
            - pkg: github.com/taigrr/bubbleterm
              desc: "invariant 4 - reach bubbleterm only through internal/tui/terminal"
            - pkg: github.com/creack/pty
              desc: "invariant 4 - internal/tui/terminal owns the PTY"

        # internal/tui/app is where the TUI lives. internal/tui/terminal is the one
        # exception and a real one: bubbleterm is itself a bubbletea component,
        # so termwrap.Terminal returns tea.Cmd and cannot avoid the import.
        bubbletea:
          files:
            - "!**/internal/tui/app/**"
            - "!**/internal/tui/terminal/**"
            - "!**/internal/tui/theme/**"
          deny:
            - pkg: charm.land/bubbletea/v2
              desc: "the TUI lives in internal/tui/app; internal/tui/terminal is the wrapper exception"
            - pkg: charm.land/bubbles/v2
              desc: "the TUI lives in internal/tui/app"
            - pkg: charm.land/lipgloss/v2
              desc: "rendering lives in internal/tui/app"

        # The rest of the seams named in docs/ARCHITECTURE.md: one package per
        # third-party surface, so a breaking upgrade has one blast radius.
        wrappers:
          files:
            - "!**/internal/infra/highlight/**"
            - "!**/internal/infra/gitdiff/**"
          deny:
            - pkg: github.com/alecthomas/chroma/v2
              desc: "invariant 4 in spirit - internal/infra/highlight owns chroma"
            - pkg: github.com/bluekeyes/go-gitdiff
              desc: "internal/infra/gitdiff owns diff parsing"

        # Shelling out is a capability, not a convenience. These six are the
        # packages that do it today; scripts/depguard_test.go asserts the list
        # still matches the code, which is the half depguard cannot check.
        # Tests are exempt: internal/ui, internal/service/status/e2e and scripts all
        # drive subprocesses to build fixtures.
        subprocess:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/infra/agentcli/**"
            - "!**/internal/infra/detach/**"
            - "!**/internal/infra/forge/**"
            - "!**/internal/infra/gateexec/**"
            - "!**/internal/infra/golist/**"
            - "!**/internal/infra/notify/**"
            - "!**/internal/tui/terminal/**"
            - "!**/internal/infra/vcs/**"
          deny:
            - pkg: os/exec
              desc: "shelling out belongs to infra/agentcli, infra/detach, infra/forge, infra/gateexec, infra/golist, infra/notify, tui/terminal and infra/vcs"
        # The network is a capability for the same reason (#453): internal/infra/forge's
        # REST fallback carries a token borrowed from the environment, and a
        # second HTTP client elsewhere is a second place it could go.
        # scripts/network_test.go asserts the list still matches the code.
        # Tests are exempt: they stand httptest servers in for the forges.
        network:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/infra/forge/**"
          deny:
            - pkg: net/http
              desc: "the network belongs to internal/infra/forge (#453)"
    forbidigo:
      forbid:
        # Invariant 5: stdout belongs to the TUI.
        - pattern: '^fmt\.Print.*$'
          msg: "stdout belongs to the TUI (invariant 5) - use slog to the file handler"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, dupl, forbidigo]
