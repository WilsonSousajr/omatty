version: "2"
linters:
  enable:
    - funlen
    - dupl
    - gocyclo
    - gocognit
    - revive
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - forbidigo
  settings:
    funlen:
      lines: 20
      statements: 15
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 10
    gocognit:
      # Cognitive complexity, not McCabe's: it weights nesting and ignores
      # switch arms, so it measures what a reader pays rather than what a
      # test suite must cover. 15 is SonarSource's own threshold. It is here
      # because AGENTS.md's "maximum 2 levels of indentation" had nothing
      # enforcing it, and nesting depth is exactly what this metric weights.
      min-complexity: 15
    forbidigo:
      forbid:
        # Invariant 5: stdout belongs to the TUI.
        - pattern: '^fmt\.Print.*$'
          msg: "stdout belongs to the TUI (invariant 5) - use slog to the file handler"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, dupl, forbidigo]
