name: release
# A v* tag is a release (#327): the whole gate runs again on the tagged commit,
# and only then does GoReleaser build and publish - four binaries, checksums,
# notes from CHANGELOG.md's own section, and the Homebrew cask. Tagging stays
# the maintainer's decision (AGENTS.md "Branches and releases").
on:
  push:
    tags: ['v*']

env:
  # Pinned, and equal to ci.yml's, which checks the release configuration on
  # every pull request with the same GoReleaser (scripts/hygiene_test.go).
  GORELEASER_VERSION: v2.18.2

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Outside the checkout: GoReleaser refuses a dirty tree. A tag the
      # changelog does not describe fails here, before anything publishes.
      - name: release notes
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser renders the cask but does not upload it (#369): it can only
      # write the install hook as a raw postflight block, which Homebrew
      # deprecates. cask-steps.sh writes the hook as postflight_steps - the
      # same step ci.yml lints and installs on every pull request - and the
      # tap is written here instead, with the token GoReleaser used to use.
      - name: cask steps
        run: ./scripts/cask-steps.sh dist/homebrew/Casks/omatty.rb
      - uses: actions/checkout@v4
        with:
          repository: WilsonSousajr/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: publish the cask
        run: |
          cp dist/homebrew/Casks/omatty.rb homebrew-tap/Casks/omatty.rb
          cd homebrew-tap
          git config user.name goreleaserbot
          git config user.email bot@goreleaser.com
          git add Casks/omatty.rb
          git commit -m "Brew cask update for omatty version $GITHUB_REF_NAME"
          git push
