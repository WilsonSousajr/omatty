name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole gate again on a v* tag before publishing (#327).
  workflow_call:

env:
  # Pinned so CI and the local gate run the identical linter (AGENTS.md).
  GOLANGCI_VERSION: v2.13.2
  # Pinned for the same reason: a scanner that changes under you reports
  # different things on different days, and the gate cannot tell a new
  # finding from a new scanner.
  GOVULN_VERSION: v1.8.0
  # Exact, not "1.26". setup-go resolves a floating minor to the newest
  # patch, and it had drifted to 1.26.8 while go.mod said 1.26.5 - which is
  # not cosmetic: govulncheck finds GO-2026-6088 reachable on 1.26.5 and
  # nothing on 1.26.8, so the same gate passed here and failed locally (#261).
  # Keep in step with go.mod; scripts/hygiene_test.go asserts they match.
  GO_VERSION: "1.26.8"
  # Equal to release.yml's, so a pull request checks the release configuration
  # with the GoReleaser a tag will publish with (#327).
  GORELEASER_VERSION: v2.18.2

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: module tidiness
        run: go mod tidy -diff
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - name: lint
        run: "$(go env GOPATH)/bin/golangci-lint run"
      # Before the test suite: a go list and an AST walk cost seconds, and an
      # architectural violation should surface before four minutes of -race.
      # Same cheapest-first rule internal/gate's Detect already documents.
      - name: dependency structure
        run: ./scripts/check-deps.sh
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULN_VERSION }}
      - name: vulnerabilities
        run: "$(go env GOPATH)/bin/govulncheck ./..."
      - name: test
        run: go test ./... -race
      - name: coverage gate
        run: ./scripts/check-coverage.sh 90
      # Straight after the coverage gate, so it reuses the cover.out that step
      # just wrote. Anywhere else and it regenerates the profile, doubling the
      # suite's cost on both runners for no visible reason.
      - name: crap gate
        run: ./scripts/check-crap.sh 12
      - name: build
        run: go build ./...

  # The release configuration, checked and built as a snapshot on every pull
  # request so a broken .goreleaser.yaml fails here rather than on a tag.
  # Nothing is published: --skip=publish, and no token is given (#327).
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: release config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish
      # The cask the snapshot rendered, given its install hook the way a tag
      # gives it (#369), then linted by Homebrew's own cops: Cask/InstallSteps
      # is the cop that flags a raw postflight block. The cops only apply
      # under a Casks/ directory. The negative control is the cask v0.8.1
      # published, which must fail, or a pass here proves nothing.
      - name: cask steps
        run: ./scripts/cask-steps.sh dist/homebrew/Casks/omatty.rb
      - name: cask style
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style dist/homebrew/Casks/omatty.rb
          mkdir -p "$RUNNER_TEMP/deprecated/Casks"
          cp scripts/testdata/omatty-cask-v0.8.1.rb "$RUNNER_TEMP/deprecated/Casks/omatty.rb"
          if brew style "$RUNNER_TEMP/deprecated/Casks/omatty.rb"; then
            echo "brew style passed the deprecated postflight block; the check above is blind" >&2
            exit 1
          fi

  # The hook cask-steps.sh writes, installed for real (#369): brew style says
  # the stanza is well formed, only an install says `run` finds the binary.
  # The published cask stands in for the snapshot's, whose URLs name a release
  # that does not exist; any hook it has is replaced by the one cask-steps.sh
  # writes. HOMEBREW_DEVELOPER makes a deprecation an error rather than a
  # warning, and the negative control proves it does.
  cask-install:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      # The Homebrew a stranger has: installing updates it first, and the
      # image's copy predates the deprecation, so without this the negative
      # control below passes the deprecated block. Not in developer mode,
      # which would update to master rather than the latest release.
      - name: current Homebrew
        run: |
          brew update
          brew --version
      # Homebrew 7 refuses to load casks from a tap nobody has trusted.
      - name: a local tap
        run: |
          brew tap-new --no-git omatty/verify
          brew trust omatty/verify
          echo "CASKS=$(brew --repository omatty/verify)/Casks" >> "$GITHUB_ENV"
      - name: the deprecated hook fails
        env:
          HOMEBREW_DEVELOPER: 1
        run: |
          mkdir -p "$CASKS"
          cp scripts/testdata/omatty-cask-v0.8.1.rb "$CASKS/omatty.rb"
          # Without GITHUB_ACTIONS, or Homebrew annotates this expected error
          # on the run, and a green job reads as a failure.
          if env -u GITHUB_ACTIONS brew info --cask omatty/verify/omatty > "$RUNNER_TEMP/info.txt" 2>&1; then
            cat "$RUNNER_TEMP/info.txt"
            echo "Homebrew loaded a raw postflight block without complaint; this job cannot see a deprecation" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/info.txt"
          grep -q postflight "$RUNNER_TEMP/info.txt"
      - name: install with the hook as steps
        env:
          HOMEBREW_DEVELOPER: 1
        run: |
          curl -fsSL https://raw.githubusercontent.com/WilsonSousajr/homebrew-tap/main/Casks/omatty.rb |
            awk '/^  postflight(_steps)? do$/ { skip = 1 } !skip { print } skip && /^  end$/ { skip = 0 }' > "$CASKS/omatty.rb"
          ./scripts/cask-steps.sh "$CASKS/omatty.rb"
          brew install --cask omatty/verify/omatty
          omatty --version
      - name: the binary is not quarantined
        run: |
          staged="$(brew --caskroom)/omatty/$(brew info --cask --json=v2 omatty/verify/omatty | jq -r '.casks[0].version')/omatty"
          if xattr -p com.apple.quarantine "$staged" 2>/dev/null; then
            echo "$staged is still quarantined; the hook did not reach it" >&2
            exit 1
          fi
          download="$(brew --cache --cask omatty/verify/omatty)"
          if ! xattr -p com.apple.quarantine "$download" >/dev/null 2>&1; then
            echo "::notice::the download was never quarantined on this runner, so the check above could not fail"
          fi
