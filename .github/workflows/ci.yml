name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned so CI and the local gate run the identical linter (AGENTS.md).
  GOLANGCI_VERSION: v2.13.2

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - name: lint
        run: "$(go env GOPATH)/bin/golangci-lint run"
      - name: test
        run: go test ./... -race
      - name: coverage gate
        run: ./scripts/check-coverage.sh 90
      - name: build
        run: go build ./...
