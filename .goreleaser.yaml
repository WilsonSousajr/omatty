# GoReleaser configuration (#327). A v* tag runs .github/workflows/release.yml:
# the gate first, then this - four binaries, checksums, the release notes from
# CHANGELOG.md's own section, and a Homebrew cask in WilsonSousajr/homebrew-tap.
# ci.yml checks this file and builds a snapshot from it on every pull request,
# so a broken configuration fails a PR rather than a release.
version: 2

project_name: omatty

builds:
  - id: omatty
    main: ./cmd/omatty
    binary: omatty
    env:
      # Nothing in omatty needs cgo, so one Linux runner builds every target.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # {{.Tag}} keeps the leading v: `omatty --version` prints "omatty v0.3.0",
    # the same string a `go install ...@v0.3.0` build reports (#134).
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: omatty
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# The notes come from scripts/release-notes.sh via --release-notes, which
# release.yml always passes, so GoReleaser's generated changelog is never what
# a release publishes. The changelog pipe must stay enabled all the same: it is
# the pipe that reads --release-notes, and `disable: true` published v0.3.0
# with an empty body (#367, guarded by scripts/release_notes_test.go).

release:
  github:
    owner: WilsonSousajr
    name: omatty

homebrew_casks:
  - name: omatty
    homepage: https://github.com/WilsonSousajr/omatty
    description: "Terminal ADE: multiple projects and parallel Claude Code sessions in one TUI"
    binaries: [omatty]
    repository:
      owner: WilsonSousajr
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # Rendered into dist/homebrew/Casks/omatty.rb, never uploaded (#369). The
    # install hook - the binary is unsigned, so Gatekeeper refuses a freshly
    # installed copy without it - is not here: this GoReleaser can only render
    # it as a raw `postflight` block, which Homebrew deprecates, and every
    # install printed a warning asking the user to report a bug in our tap.
    # scripts/cask-steps.sh writes it as `postflight_steps` instead, and
    # release.yml publishes the result with HOMEBREW_TAP_TOKEN, which this
    # file therefore no longer names. `repository` stays: without it
    # GoReleaser renders nothing at all. Move the hook back here once a
    # GoReleaser release can emit install steps (goreleaser#6873).
    skip_upload: true
